# Energy anomaly benchmark configuration. Every adjustable setting lives here.

seed: 42
n_jobs: -1
use_gpu: false
sample_fraction: null        # e.g. 0.05 for a quick stratified run; CLI --sample overrides

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs

kaggle:
  competition: energy-anomaly-detection

data:
  target: anomaly
  reading: meter_reading
  id_column: building_id
  time_column: timestamp

features:
  use_building_id: false
  contextual: true            # reading minus the building's typical level per hour/weekday/month
  rolling_features: false     # per-building 24h rolling stats (causal, past-only window)
  rolling_window_hours: 24
  drop_constant: true         # drop feature columns with a single value (e.g. year)
  # Composite keys from train_features.csv that encode building_id; dropped so the
  # building identity cannot re-enter the model through them.
  drop_columns:
    - building_weekday_hour
    - building_weekday
    - building_month
    - building_hour
    - building_meter
    - weekday_hour

split:
  mode: stratified_random     # stratified_random | by_building | temporal
  ratios:
    split_30_70: 0.30
    split_40_60: 0.40
    split_50_50: 0.50
    split_60_40: 0.60
    split_80_20: 0.80

models:
  random_forest:
    n_estimators: 300
    class_weight: balanced_subsample
    min_samples_leaf: 2
  isolation_forest:
    n_estimators: 300
    contamination: train_rate   # "train_rate" or a float in (0, 0.5]
    fit_on_normal_only: false
    feature_set: all            # "all" features or "contextual" (building-deviation features only)
  decision_tree:
    max_depth: null
    min_samples_leaf: 5
    class_weight: balanced
  xgboost:
    n_estimators: 400
    learning_rate: 0.08
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    eval_metric: aucpr

# Hyperparameter search, run per split on that split's train portion only
# (stratified subsample, stratified k-fold CV, scored by PR-AUC). The values
# under models: above are always tried first, so tuning never loses to them
# on cross-validation. Set enabled: false to train with the values above.
tuning:
  enabled: true
  folds: 3
  # What each search maximises: pr_auc (ranking quality, default) or f1 (F1 of the
  # model's own predictions at its default threshold). The Decision Tree's leaf
  # probabilities are coarse, so a setting that ranks better can predict worse at
  # 0.5; it is therefore tuned directly for F1.
  objective:
    decision_tree: f1
  # Rows of the train portion used for tuning (null = all of them). A single tree's best
  # depth depends on how much data it is fitted on, so the Decision Tree, which is cheap,
  # is tuned on the full train portion with one stratified 75/25 hold-out.
  sample_size:
    random_forest: 100000
    isolation_forest: 200000
    decision_tree: null
    xgboost: 150000
  folds_per_model:
    decision_tree: 1
  n_iter:
    random_forest: 8
    isolation_forest: 12
    decision_tree: 16
    xgboost: 10
  spaces:
    random_forest:
      max_depth: [null, 20, 30]
      min_samples_leaf: [1, 2, 5, 10]
      max_features: [sqrt, 0.3, 0.5]
      class_weight: [balanced_subsample, null]
    isolation_forest:
      n_estimators: [200, 300, 500]
      max_samples: [256, 1024, 4096]
      max_features: [0.5, 0.75, 1.0]
      feature_set: [all, contextual]
    decision_tree:
      max_depth: [null, 10, 15, 20, 30]
      min_samples_leaf: [1, 5, 20, 50, 100]
      criterion: [gini, entropy]
      class_weight: [balanced, null]
    xgboost:
      n_estimators: [300, 600, 1000]
      learning_rate: [0.03, 0.05, 0.1]
      max_depth: [6, 8, 10, 12]
      subsample: [0.7, 0.8, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
      min_child_weight: [1, 5, 10]
      pos_weight_mode: [ratio, sqrt, none]

evaluation:
  default_threshold: 0.5
  permutation_importance_isolation_forest: false
  permutation_sample_size: 20000

plots:
  dpi: 300
  formats: [png, svg]
  font_family: [Inter, DejaVu Sans]
  heatmap_cmap: mako
  palette:
    random_forest: "#1F6F78"     # deep teal
    isolation_forest: "#7D4E77"  # muted plum
    decision_tree: "#D9822B"     # burnt orange
    xgboost: "#4A6FA5"           # slate blue
  display_names:
    random_forest: Random Forest
    isolation_forest: Isolation Forest
    decision_tree: Decision Tree
    xgboost: XGBoost
