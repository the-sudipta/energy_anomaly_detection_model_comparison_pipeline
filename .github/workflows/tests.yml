name: Tests

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "config/**", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the smoke test (synthetic data, no network)
        run: python -m pytest -q
